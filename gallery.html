<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5B6E2C"><title>Wedding Moments · Hafiy & Aina</title><link rel="stylesheet" href="style.css?v=social-7"></head><body class="feed-page"><main class="feed-shell"><nav class="feed-nav"><a href="menu.html">← Main menu</a><span>Hafiy & Aina</span></nav><header class="feed-heading"><span class="eyebrow">OUR WEDDING, THROUGH YOUR EYES</span><h1>Wedding Moments</h1><p>A photo, a smile, a little wish for us.</p></header><section class="feed-composer" aria-labelledby="composerTitle"><h2 id="composerTitle">Share a memory</h2><form id="albumUploadForm"><div class="composer-fields"><label>Your name (optional)<input id="albumName" maxlength="60" autocomplete="given-name" placeholder="Your name"></label><label>Your wishes (optional)<textarea id="albumWishes" maxlength="500" rows="3" placeholder="Write your wishes for Hafiy & Aina…"></textarea></label></div><label class="photo-file-label">Choose a photo<input id="albumFile" type="file" accept="image/*" required></label><img id="albumUploadPreview" alt="Selected photo preview" hidden><p class="guest-note">Your photo, name and wishes will be visible to everyone with the album link.</p><button id="albumUploadBtn" class="btn primary" type="submit">Share to album</button><p id="albumUploadMessage" role="status" aria-live="polite"></p></form></section><div class="feed-toolbar"><h2>Guest memories</h2><button id="refreshGalleryBtn" class="btn secondary">Refresh feed</button></div><p id="galleryMessage" class="feed-status" role="status" aria-live="polite">Loading memories…</p><div id="galleryGrid" class="social-feed"></div><button id="loadMoreBtn" class="btn secondary load-more" hidden>Load more memories</button><footer>Salam kasih, Hafiy & Aina ✦</footer></main><script src="gallery.js?v=social-7"></script></body></html>
